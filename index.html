<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#123b32" />
    <title>POL225 Study Hub</title>
    <style>
      :root {
        font-family:
          Inter,
          system-ui,
          -apple-system,
          Arial,
          sans-serif;
        color: #18352e;
        background: #f4f7f4;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #8dd0a2;
        outline-offset: 3px;
      }
      .wrap {
        max-width: 1150px;
        margin: auto;
        padding: 24px 22px 90px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 20px;
        border-bottom: 1px solid #dce8dd;
      }
      .logo {
        font-weight: 900;
        font-size: 21px;
        color: #154b3c;
      }
      .logo small {
        display: block;
        font-size: 11px;
        letter-spacing: 2px;
        color: #698578;
      }
      .nav {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .nav button,
      .btn {
        border: 1px solid #d2e1d6;
        background: white;
        color: #214c3c;
        border-radius: 12px;
        padding: 10px 13px;
        font-weight: 700;
      }
      .nav button.active,
      .btn.primary {
        background: #164b3e;
        color: white;
        border-color: #164b3e;
      }
      .hero {
        margin: 26px 0;
        padding: 34px;
        border-radius: 24px;
        background: linear-gradient(115deg, #143d35 0%, #246c54 100%);
        color: white;
        overflow: hidden;
        position: relative;
      }
      .hero:before {
        content: "";
        position: absolute;
        right: -80px;
        top: -120px;
        width: 390px;
        height: 390px;
        border: 70px solid #ffffff10;
        border-radius: 50%;
      }
      .hero > * {
        position: relative;
      }
      .hero h1 {
        font-size: clamp(28px, 4vw, 45px);
        letter-spacing: -1.6px;
        margin: 12px 0;
      }
      .hero p {
        max-width: 690px;
        line-height: 1.7;
        color: #e7f3ea;
      }
      .tag {
        font-size: 11px;
        letter-spacing: 1.8px;
        text-transform: uppercase;
        font-weight: 900;
        color: #aecab6;
      }
      .hero .tag {
        color: #c8e2cd;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
        margin: 22px 0;
      }
      .stat,
      .card,
      .panel {
        background: white;
        border: 1px solid #e1eae2;
        border-radius: 18px;
        padding: 21px;
        box-shadow: 0 3px 12px #1c4d2b07;
      }
      .stat b {
        display: block;
        font-size: 30px;
        color: #164b3e;
      }
      .stat span,
      .muted {
        color: #647a6c;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .card h3 {
        margin: 13px 0 8px;
        font-size: 21px;
        line-height: 1.3;
      }
      .card p,
      .panel p {
        line-height: 1.65;
        color: #536e5d;
      }
      .card .btn {
        margin-top: 10px;
      }
      .section-title {
        font-size: 24px;
        letter-spacing: -0.7px;
        margin: 28px 0 18px;
      }
      .reading {
        max-width: 790px;
        margin: 28px auto;
      }
      .reading h1 {
        font-size: clamp(30px, 4vw, 44px);
        letter-spacing: -1px;
      }
      .reading .panel {
        margin: 14px 0;
        padding: 25px;
      }
      .reading .panel h2 {
        margin-top: 0;
        font-size: 20px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      .back {
        border: 0;
        background: none;
        color: #185b43;
        font-weight: 800;
        padding: 9px 0;
      }
      .option {
        display: block;
        border: 1px solid #d5e4d9;
        border-radius: 12px;
        padding: 14px;
        margin: 9px 0;
        cursor: pointer;
      }
      .option:has(input:checked) {
        background: #ecf8ee;
        border-color: #388763;
      }
      .feedback {
        background: #eef6f0;
        border-radius: 10px;
        padding: 13px;
        margin-top: 12px;
      }
      .feedback.bad {
        background: #fff1ed;
      }
      .flash {
        display: block;
        width: 100%;
        border: 1px solid #c2dccb;
        border-radius: 20px;
        padding: 48px 20px;
        background: linear-gradient(140deg, #eaf5e9, #d4ebda);
        color: #164b3e;
        font-size: 24px;
        line-height: 1.4;
        min-height: 235px;
      }
      .timer {
        font-variant-numeric: tabular-nums;
        font-size: 26px;
        font-weight: 900;
        color: #155040;
      }
      .sticky {
        position: sticky;
        top: 0;
        background: #f4f7f4;
        padding: 14px 0;
        z-index: 2;
      }
      .progress {
        height: 9px;
        background: #e1ebe2;
        border-radius: 12px;
        overflow: hidden;
      }
      .progress i {
        display: block;
        height: 100%;
        background: #32905f;
      }
      .error {
        background: #fff1ed;
        padding: 15px;
        border-radius: 12px;
      }
      .foot {
        padding: 38px 0;
        color: #7d8c82;
        font-size: 13px;
      }
      .mobile {
        display: none;
      }
      input[type="radio"] {
        accent-color: #216747;
      }
      @media (max-width: 850px) {
        .grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 640px) {
        .wrap {
          padding: 17px 16px 95px;
        }
        .top {
          padding-bottom: 12px;
        }
        .top .nav {
          display: none;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .stats {
          gap: 8px;
        }
        .stat {
          padding: 13px;
        }
        .stat b {
          font-size: 25px;
        }
        .stat span {
          font-size: 12px;
        }
        .hero {
          padding: 25px;
          margin: 18px 0;
        }
        .mobile {
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          display: grid;
          grid-template-columns: repeat(5, 1fr);
          background: white;
          border-top: 1px solid #dde5dd;
          z-index: 5;
          padding-bottom: env(safe-area-inset-bottom);
        }
        .mobile button {
          background: white;
          border: 0;
          padding: 12px 2px;
          font-size: 11px;
          font-weight: 800;
          color: #35604c;
        }
        .mobile button.active {
          color: #067142;
          background: #eef8f0;
        }
        .reading .panel {
          padding: 18px;
        }
        .flash {
          font-size: 19px;
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .card,
        .btn {
          transition:
            transform 0.2s,
            box-shadow 0.2s;
        }
        .card:hover {
          transform: translateY(-2px);
          box-shadow: 0 8px 22px #1b4d2712;
        }
      }
      .flash-layout {
        max-width: 820px;
      }
      .flash-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
      }
      .flash-header h1 {
        margin: 6px 0;
        font-size: clamp(30px, 4vw, 43px);
        letter-spacing: -1.4px;
      }
      .flash-total {
        background: #e6f3e9;
        border-radius: 17px;
        padding: 17px 22px;
        text-align: center;
        min-width: 112px;
      }
      .flash-total strong {
        font-size: 37px;
        color: #18583f;
        display: block;
      }
      .flash-total span {
        font-size: 12px;
        color: #426a54;
      }
      .flash-toolbar {
        margin: 25px 0 19px;
        display: grid;
        gap: 8px;
      }
      .flash-toolbar label {
        font-weight: 800;
        font-size: 13px;
      }
      .flash-select {
        width: 100%;
        border: 1px solid #cddfd2;
        border-radius: 13px;
        padding: 14px 15px;
        background: #fff;
        color: #194534;
        font-weight: 700;
        font-size: 16px;
      }
      .flash-metrics {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        color: #577263;
        font-size: 14px;
        margin: 15px 0 10px;
      }
      .flash-topic {
        font-size: 13px;
        font-weight: 800;
        color: #357456;
        margin: 24px 0 10px;
      }
      .flash-premium {
        min-height: 290px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        gap: 25px;
        padding: 32px 30px;
        border: 1px solid #b7d8c1;
        background: linear-gradient(145deg, #f3fbf5, #d9efe1);
        box-shadow: 0 12px 30px #17472c12;
        transition:
          background 0.2s,
          transform 0.2s;
      }
      .flash-premium.revealed {
        background: linear-gradient(145deg, #fffdf5, #e8f1db);
      }
      .flash-premium .flash-eyebrow {
        font-size: 12px;
        letter-spacing: 2px;
        font-weight: 900;
        color: #548267;
      }
      .flash-premium .flash-question {
        font-size: clamp(21px, 3vw, 29px);
        font-weight: 800;
        line-height: 1.35;
        max-width: 600px;
      }
      .flash-premium .flash-hint {
        font-size: 13px;
        color: #5b7966;
      }
      .flash-controls {
        display: grid;
        grid-template-columns: 1fr 1.25fr 1fr;
        gap: 10px;
        margin: 16px 0;
      }
      .flash-controls .btn {
        min-height: 50px;
      }
      .flash-bottom {
        display: flex;
        align-items: center;
        gap: 15px;
        justify-content: space-between;
        margin: 15px 0 35px;
      }
      .flash-bottom .muted {
        font-size: 12px;
      }
      @media (max-width: 640px) {
        .flash-header {
          align-items: flex-start;
        }
        .flash-total {
          padding: 12px;
          min-width: 84px;
        }
        .flash-total strong {
          font-size: 30px;
        }
        .flash-total span {
          font-size: 10px;
        }
        .flash-premium {
          min-height: 310px;
          padding: 25px 20px;
        }
        .flash-controls {
          gap: 6px;
        }
        .flash-controls .btn {
          font-size: 12px;
          padding: 12px 6px;
        }
        .flash-bottom {
          flex-direction: column;
          align-items: flex-start;
        }
        .flash-layout {
          margin-top: 20px;
        }
      }
      .exam-layout {
        max-width: 850px;
      }
      .exam-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        background: #f5f8f5;
        padding: 15px 0;
      }
      .exam-status {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin: 20px 0 10px;
        color: #40634f;
        font-size: 14px;
      }
      .exam-question {
        margin: 18px 0;
        min-height: 320px;
      }
      .exam-question h2 {
        font-size: clamp(21px, 2.8vw, 27px);
        line-height: 1.4;
      }
      .exam-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin: 16px 0;
      }
      .exam-actions .btn {
        min-height: 52px;
      }
      .exam-navigator {
        margin-top: 18px;
      }
      .exam-numbers {
        display: grid;
        grid-template-columns: repeat(10, minmax(0, 1fr));
        gap: 7px;
        margin-top: 16px;
      }
      .exam-number {
        min-width: 0;
        min-height: 42px;
        border: 1px solid #cfdfd2;
        border-radius: 9px;
        background: white;
        color: #24523c;
        font-weight: 750;
        cursor: pointer;
      }
      .exam-number.answered {
        background: #d6efdf;
        border-color: #5f9c74;
      }
      .exam-number.current {
        outline: 3px solid #1b6648;
        outline-offset: 1px;
      }
      .revision-grid {
        margin-top: 22px;
      }
      .revision-detail {
        margin-top: 22px;
      }
      .revision-detail h3 {
        font-size: 17px;
        margin-top: 23px;
        color: #20583e;
      }
      .revision-detail p {
        line-height: 1.7;
      }
      @media (max-width: 640px) {
        .exam-top {
          position: sticky;
          top: 0;
          z-index: 3;
        }
        .exam-top .btn {
          font-size: 12px;
        }
        .exam-numbers {
          grid-template-columns: repeat(5, minmax(0, 1fr));
        }
        .exam-question {
          min-height: 280px;
        }
        .exam-status {
          font-size: 12px;
        }
        .revision-detail {
          padding: 20px;
        }
      }
      .revision-grid {
        margin-top: 24px;
      }
      .revision-grid .card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      .revision-grid .card .btn {
        margin-top: auto;
      }
      .revision-detail {
        display: grid;
        gap: 16px;
        margin-top: 22px;
      }
      .revision-detail .panel {
        margin: 0;
      }
      .revision-detail h2 {
        font-size: clamp(24px, 3vw, 33px);
        line-height: 1.2;
      }
      .revision-detail h3 {
        font-size: clamp(17px, 2vw, 20px);
        margin: 0 0 17px;
        color: #194e39;
      }
      .revision-detail p,
      .revision-detail li,
      .revision-detail dd {
        line-height: 1.75;
      }
      .revision-detail ol {
        padding-left: 24px;
      }
      .revision-detail li {
        margin-bottom: 14px;
      }
      .revision-definitions {
        margin: 0;
        display: grid;
        gap: 0;
      }
      .revision-definitions > div {
        padding: 14px 0;
        border-bottom: 1px solid #e1eae3;
      }
      .revision-definitions > div:last-child {
        border-bottom: 0;
      }
      .revision-definitions dt {
        font-weight: 800;
        color: #154b36;
        margin-bottom: 5px;
      }
      .revision-definitions dd {
        margin: 0;
        color: #456656;
      }
      .revision-example {
        border-left: 3px solid #83ba97;
        padding: 9px 14px;
        background: #f3f9f4;
        border-radius: 0 9px 9px 0;
      }
      .revision-answer {
        background: #edf7ef;
      }
      .revision-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin: 6px 0 32px;
      }
      @media (max-width: 640px) {
        .revision-detail {
          gap: 12px;
        }
        .revision-detail .panel {
          padding: 20px;
        }
        .revision-actions {
          display: grid;
          grid-template-columns: 1fr;
        }
        .revision-actions .btn {
          min-height: 46px;
        }
      }
      .lesson-advanced {
        max-width: 880px;
      }
      .lesson-intro {
        margin: 25px 0 18px;
      }
      .lesson-intro h1 {
        font-size: clamp(30px, 4vw, 42px);
        line-height: 1.15;
        margin: 10px 0;
      }
      .lesson-intro > p:last-child {
        font-size: 17px;
        line-height: 1.65;
      }
      .lesson-modes {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin: 24px 0;
      }
      .lesson-modes .btn {
        min-height: 46px;
      }
      .lesson-outline {
        padding: 23px;
        border: 1px solid #d9e8dd;
        border-radius: 16px;
        background: #f3faf5;
        margin: 18px 0 22px;
      }
      .lesson-outline strong {
        color: #194d37;
      }
      .lesson-outline ol {
        columns: 2;
        padding-left: 22px;
        margin-bottom: 0;
      }
      .lesson-outline li {
        break-inside: avoid;
        margin: 10px 0;
      }
      .lesson-outline a {
        color: #215c40;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .lesson-section {
        scroll-margin-top: 100px;
        margin: 14px 0;
        padding: 26px;
      }
      .lesson-section h2 {
        font-size: clamp(21px, 2.7vw, 26px);
        line-height: 1.3;
        margin: 10px 0 14px;
      }
      .lesson-section p {
        font-size: 16px;
        line-height: 1.85;
        max-width: 74ch;
      }
      .lesson-completion {
        margin-top: 25px;
      }
      .lesson-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 20px 0;
      }
      .lesson-actions .btn {
        min-height: 46px;
      }
      @media (max-width: 640px) {
        .lesson-outline ol {
          columns: 1;
        }
        .lesson-section {
          padding: 20px;
        }
        .lesson-section p {
          font-size: 16px;
          line-height: 1.75;
        }
        .lesson-modes {
          display: grid;
          grid-template-columns: 1fr 1fr;
        }
        .lesson-modes .btn {
          font-size: 13px;
        }
        .lesson-actions {
          display: grid;
          grid-template-columns: 1fr;
        }
        .lesson-actions .btn {
          width: 100%;
        }
      }
      .lesson-reading-status {
        position: sticky;
        top: 0;
        z-index: 5;
        background: rgba(244, 247, 244, 0.97);
        padding: 12px 0 10px;
        border-bottom: 1px solid #dce8dd;
        backdrop-filter: blur(10px);
      }
      .lesson-reading-status > div:first-child {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        font-size: 13px;
        color: #245541;
      }
      .lesson-reading-status .progress {
        margin: 9px 0 0;
      }
      .lesson-resume {
        margin: 14px 0;
      }
      .lesson-outline {
        padding: 0;
        overflow: hidden;
      }
      .lesson-outline > summary {
        cursor: pointer;
        list-style: none;
        padding: 19px 22px;
        font-weight: 800;
        color: #194d37;
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      .lesson-outline > summary::-webkit-details-marker {
        display: none;
      }
      .lesson-outline > summary:after {
        content: "+";
        font-size: 20px;
      }
      .lesson-outline[open] > summary:after {
        content: "−";
      }
      .lesson-outline > summary span {
        font-size: 12px;
        font-weight: 500;
        color: #6d8376;
        align-self: center;
        margin-left: auto;
      }
      .lesson-outline ol {
        padding: 0 22px 20px 45px;
        margin-top: 0;
      }
      .lesson-jump {
        border: 0;
        background: transparent;
        text-align: left;
        color: #215c40;
        text-decoration: underline;
        text-underline-offset: 3px;
        padding: 5px 0;
        line-height: 1.4;
        cursor: pointer;
      }
      .lesson-section p + p {
        margin-top: 15px;
      }
      .lesson-reflect {
        background: #f3f9f4;
        border: 1px solid #d9e8dd;
        border-radius: 12px;
        padding: 0;
        margin-top: 20px;
      }
      .lesson-reflect summary {
        padding: 15px 17px;
        font-weight: 800;
        color: #20553d;
        cursor: pointer;
      }
      .lesson-reflect[open] p {
        padding: 0 17px;
      }
      .lesson-reflect[open] p:last-child {
        padding-bottom: 15px;
      }
      .lesson-section-next {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 18px;
      }
      .lesson-section-next .btn {
        min-height: 44px;
      }
      .lesson-example-label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        font-weight: 800;
        color: #2b7c52;
      }
      .lesson-completion {
        scroll-margin-top: 100px;
      }
      .lesson-quick-label {
        padding: 20px;
      }
      .lesson-quick-label strong {
        font-size: 16px;
      }
      @media (max-width: 640px) {
        .lesson-reading-status {
          top: 0;
          padding: 10px 0 9px;
        }
        .lesson-outline > summary {
          padding: 17px;
        }
        .lesson-outline > summary span {
          display: none;
        }
        .lesson-outline ol {
          padding: 0 15px 15px 36px;
        }
        .lesson-section-next {
          display: grid;
          grid-template-columns: 1fr;
        }
        .lesson-section-next .btn {
          width: 100%;
        }
        .mobile {
          padding-bottom: env(safe-area-inset-bottom);
          font-size: 12px;
        }
        .mobile button {
          padding: 11px 3px;
          font-size: 12px;
        }
        .wrap {
          padding-bottom: calc(105px + env(safe-area-inset-bottom));
        }
      }
    </style>
    <link rel="stylesheet" href="v2.1.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>
    <div class="wrap">
      <header class="top">
